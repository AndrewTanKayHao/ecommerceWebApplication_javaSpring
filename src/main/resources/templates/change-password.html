<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>

<!--Author: Theingi Myint, Chee Wee-->

<body>
<div class="container mt-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Change Password</h2>
  <form th:action="@{/profile/change-password}" method="post">
    <div class="mb-3">
      <label for="currentPassword" class="form-label">Current Password</label>
      <input type="password" id="currentPassword" name="currentPassword" class="form-control" required />
    </div>
    <div class="mb-3">
      <label for="newPassword" class="form-label">New Password</label>
      <input type="password" id="newPassword" name="newPassword" class="form-control" required />
    </div>
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Confirm New Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" required />
    </div>
    <div class="d-flex justify-content-between mt-4">
      <a th:href="@{/profile}" class="btn btn-outline-secondary">Back to Profile</a>
      <button type="submit" class="btn btn-primary">Update Password</button>
    </div>
    <div th:if="${error}" class="alert alert-danger mt-3 text-center" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success mt-3 text-center" th:text="${message}"></div>
  </form>
</div>
</body>
</html>
